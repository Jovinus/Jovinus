<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kyung Hyun Lee — Clinical AI Researcher</title>
  <desc id="desc">A dark blue and teal banner with a clinical waveform and connected data points.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="16" x2="1143" y2="350" gradientUnits="userSpaceOnUse">
